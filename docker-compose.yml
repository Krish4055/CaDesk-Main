version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cadesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadesk_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-cadesk_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadesk_user} -d ${POSTGRES_DB:-cadesk_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
