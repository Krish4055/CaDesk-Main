# Render Deployment Blueprint for CaDesk
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. Frontend Web Application (React 19 + TypeScript + Vite)
  - type: web
    name: cadesk-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_AI_PROVIDER
        value: mock

  # 2. Python AI Inference Sidecar (FastAPI)
  - type: web
    name: cadesk-api
    runtime: python
    plan: standard
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.ai_sidecar:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CADESK_AI_MODE
        value: mock
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: 8000
